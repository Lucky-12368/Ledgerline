# Render Blueprint: New > Blueprint > point at this repo.
databases:
  - name: ledgerline-db
    databaseName: ledgerline
    plan: free        # check Render's current free-tier limits/expiry before relying on it

services:
  - type: web
    name: ledgerline
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
